<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OrganizaEdu - Web</title>
    
    <!-- Tailwind CSS para Estilização -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        background: '#0a0a0a',
                        surface: '#171717',
                        primary: '#3b82f6', // Azul moderno
                        accent: '#8b5cf6', // Roxo
                        text: '#f5f5f5'
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <!-- Fontes e Ícones -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0a0a0a; color: #f5f5f5; }
        
        /* Animações suaves para troca de telas */
        .fade-enter { animation: fadeIn 0.5s ease-out forwards; }
        .fade-exit { animation: fadeOut 0.5s ease-in forwards; }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes fadeOut {
            from { opacity: 1; transform: translateY(0); }
            to { opacity: 0; transform: translateY(-10px); visibility: hidden; }
        }

        /* Esconder telas inativas */
        .hidden-screen { display: none !important; }
    </style>
</head>
<body class="h-screen w-screen overflow-hidden flex items-center justify-center relative">

    <!-- 1. TELA DE CARREGAMENTO -->
    <div id="loading-screen" class="absolute inset-0 flex flex-col items-center justify-center bg-background z-50 flex">
        <div class="relative flex items-center justify-center mb-6">
            <!-- Efeito de brilho pulsante atrás do ícone -->
            <div class="absolute w-24 h-24 bg-primary rounded-full blur-xl opacity-50 animate-pulse"></div>
            <i class="fa-solid fa-graduation-cap text-6xl text-white relative z-10 animate-bounce"></i>
        </div>
        <h1 class="text-4xl font-extrabold tracking-tight text-white mb-2">OrganizaEdu</h1>
        <p class="text-gray-400 font-medium flex items-center gap-2">
            <i class="fa-solid fa-circle-notch fa-spin text-primary"></i> Conectando aos servidores...
        </p>
    </div>

    <!-- 2. TELA DE LOGIN -->
    <div id="login-screen" class="absolute inset-0 flex items-center justify-center bg-background z-40 hidden-screen overflow-hidden">
        <!-- Luzes decorativas de fundo (Efeito moderno para PC) -->
        <div class="absolute top-0 left-0 w-[500px] h-[500px] bg-primary/20 rounded-full blur-[120px] -translate-x-1/2 -translate-y-1/2 pointer-events-none"></div>
        <div class="absolute bottom-0 right-0 w-[500px] h-[500px] bg-accent/20 rounded-full blur-[120px] translate-x-1/2 translate-y-1/2 pointer-events-none"></div>
        
        <div class="bg-surface border border-white/10 p-10 rounded-3xl shadow-2xl z-10 max-w-md w-full mx-4 flex flex-col items-center text-center fade-enter">
            <div class="w-20 h-20 bg-background border border-white/10 rounded-2xl flex items-center justify-center mb-6 shadow-inner">
                <i class="fa-solid fa-graduation-cap text-4xl text-primary"></i>
            </div>
            
            <h2 class="text-3xl font-bold text-white mb-3">Bem-vindo de volta</h2>
            <p class="text-gray-400 mb-10 text-sm leading-relaxed">
                Acesse o OrganizaEdu pelo navegador e mantenha seus estudos sincronizados com seu celular.
            </p>

            <button id="btn-google-login" class="w-full bg-white text-black font-bold py-3 px-6 rounded-xl flex items-center justify-center gap-3 hover:bg-gray-200 hover:scale-[1.02] transition-all shadow-lg">
                <img src="https://cdn-icons-png.flaticon.com/512/2991/2991148.png" alt="Google" class="w-5 h-5">
                Entrar com Google
            </button>

            <p class="mt-8 text-xs text-gray-500">
                Ao continuar, você concorda com nossos Termos de Serviço e Política de Privacidade.
            </p>
        </div>
    </div>

    <!-- 3. TELA PRINCIPAL (Em branco por enquanto, para os próximos passos) -->
    <div id="main-app-screen" class="absolute inset-0 bg-background z-30 hidden-screen flex flex-col items-center justify-center">
        <h1 class="text-2xl font-bold text-success mb-4"><i class="fa-solid fa-check-circle mr-2"></i>Login bem-sucedido!</h1>
        <p class="text-gray-400 mb-6" id="welcome-message">Carregando seus dados...</p>
        <button id="btn-logout" class="bg-surface border border-white/10 text-white px-6 py-2 rounded-lg hover:bg-white/5 transition">
            <i class="fa-solid fa-right-from-bracket mr-2"></i>Sair
        </button>
    </div>

    <!-- FIREBASE E LÓGICA DE LOGIN -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { 
            getAuth, 
            GoogleAuthProvider, 
            signInWithPopup, 
            onAuthStateChanged, 
            signOut 
        } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";

        // Configuração do Firebase fornecida
        const firebaseConfig = {
            apiKey: "AIzaSyA3g9gmFn-Uc_SoLHsVhH7eIwgzMOYmIAQ",
            authDomain: "organizaedu.firebaseapp.com",
            projectId: "organizaedu",
            storageBucket: "organizaedu.firebasestorage.app",
            messagingSenderId: "300213242364",
            appId: "1:300213242364:web:76019e1dc63cb89f034a79",
            measurementId: "G-N1GS8DXP4Q"
        };

        // Inicialização
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const provider = new GoogleAuthProvider();

        // Referências das Telas
        const loadingScreen = document.getElementById('loading-screen');
        const loginScreen = document.getElementById('login-screen');
        const mainAppScreen = document.getElementById('main-app-screen');

        // Função para trocar de tela
        function showScreen(screenElement) {
            loadingScreen.classList.add('hidden-screen');
            loginScreen.classList.add('hidden-screen');
            mainAppScreen.classList.add('hidden-screen');
            
            screenElement.classList.remove('hidden-screen');
        }

        // Observador de Estado de Autenticação
        onAuthStateChanged(auth, (user) => {
            // Simular um tempinho de carregamento para as fontes e estilos renderizarem bonitos
            setTimeout(() => {
                if (user) {
                    // Usuário logado
                    document.getElementById('welcome-message').innerText = `Bem-vindo, ${user.displayName}! A interface principal será construída aqui.`;
                    showScreen(mainAppScreen);
                    console.log("Usuário logado:", user.uid);
                } else {
                    // Usuário não logado
                    showScreen(loginScreen);
                }
            }, 1500); 
        });

        // Ação de Login
        document.getElementById('btn-google-login').addEventListener('click', async () => {
            try {
                // Volta pra tela de loading durante o processamento do popup
                showScreen(loadingScreen); 
                await signInWithPopup(auth, provider);
                // O onAuthStateChanged vai ser acionado automaticamente se der certo
            } catch (error) {
                console.error("Erro no login:", error);
                alert("Falha ao fazer login: " + error.message);
                showScreen(loginScreen); // Volta pro login se der erro
            }
        });

        // Ação de Logout (provisório para testes)
        document.getElementById('btn-logout').addEventListener('click', () => {
            showScreen(loadingScreen);
            signOut(auth).catch(error => {
                console.error("Erro ao sair:", error);
                showScreen(mainAppScreen);
            });
        });
    </script>
</body>
</html>
